<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Work Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Employee Work Manager</h1>

    <form action="/add" method="POST">
        <input type="text" name="name" placeholder="Employee name" required>
        <input type="text" name="task" placeholder="Work / Task" required>
        <button type="submit">Add Employee</button>
    </form>

    <h2>Employees & Work</h2>

    <table>
        <thead>
            <tr>
                <th>Employee</th>
                <th>Task</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for employee in employees %}
            <tr>
                <td>{{ employee[1] }}</td>
                <td>{{ employee[2] }}</td>
                <td>
                    <a href="/delete/{{ employee[0] }}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
